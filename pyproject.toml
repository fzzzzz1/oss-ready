[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-ready"
version = "0.1.0"
description = "A zero-dependency CLI that checks whether a project is ready to be open sourced."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "deepseek1 contributors" }]
keywords = ["open-source", "license", "secrets", "audit", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
oss-ready = "oss_ready.cli:main"

[project.urls]
Homepage = "https://example.com/oss-ready"

[tool.setuptools.packages.find]
where = ["src"]
